<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="docs/agents/handoff.md and decisions.md flow through a shared-memory reader into ZCode and OpenCode sessions">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", monospace; }
      .h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; fill: #e6edf3; }
      .sub { font-size: 13.5px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .accent-card { fill: #1e1b4b; stroke: #3730a3; stroke-width: 1; }
      .file { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .role { font-size: 11.5px; fill: #8b949e; }
      .name { font-size: 14.5px; font-weight: 600; fill: #e6edf3; }
      .body { font-size: 12px; fill: #a7b0ba; }
      .cap { font-size: 11px; fill: #6e7681; }
      .link { stroke: #6e7681; stroke-width: 1.4; fill: none; }
      .accent-dot { fill: #818cf8; }
      .divider { stroke: #30363d; stroke-width: 1; }
      .foot { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .foot-sub { font-size: 13px; fill: #8b949e; }
      .foot-cap { font-size: 11px; fill: #6e7681; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="359" rx="18" fill="#0d1117" stroke="#30363d"/>

  <text class="t h1" x="44" y="58">agent-shared-memory</text>
  <text class="t sub" x="44" y="82">Workspace memory that every agent session starts with.</text>

  <rect class="card" x="44" y="112" width="208" height="64" rx="12"/>
  <text class="m file" x="62" y="139">handoff.md</text>
  <text class="t role" x="62" y="159">current state, rewritten</text>

  <rect class="card" x="44" y="188" width="208" height="64" rx="12"/>
  <text class="m file" x="62" y="215">decisions.md</text>
  <text class="t role" x="62" y="235">append-only history</text>

  <text class="t cap" x="44" y="276">docs/agents/ · one pair per workspace</text>

  <path class="link" d="M 252 144 H 272"/>
  <path class="link" d="M 252 220 H 272"/>
  <path class="link" d="M 272 144 V 220"/>
  <path class="link" d="M 272 180 H 312" marker-end="url(#arrow)"/>

  <rect class="accent-card" x="320" y="124" width="240" height="112" rx="12"/>
  <text class="t name" x="340" y="151">shared-memory</text>
  <circle class="accent-dot" cx="346" cy="172" r="2.6"/>
  <text class="t body" x="358" y="176">digest check</text>
  <circle class="accent-dot" cx="346" cy="194" r="2.6"/>
  <text class="t body" x="358" y="198">full / state render</text>
  <text class="t cap" x="340" y="220">read-only · mtime cache</text>

  <path class="link" d="M 560 180 H 596 V 148 H 616" marker-end="url(#arrow)"/>
  <path class="link" d="M 560 180 H 596 V 244 H 616" marker-end="url(#arrow)"/>

  <rect class="card" x="624" y="104" width="332" height="88" rx="12"/>
  <text class="t name" x="644" y="132">ZCode</text>
  <text class="t body" x="644" y="154">session start → full handoff</text>
  <text class="t body" x="644" y="173">files changed → full again</text>

  <rect class="card" x="624" y="200" width="332" height="88" rx="12"/>
  <text class="t name" x="644" y="228">OpenCode</text>
  <text class="t body" x="644" y="250">first request → full handoff</text>
  <text class="t body" x="644" y="269">later requests → State only</text>

  <path class="divider" d="M 44 304 H 956"/>
  <text class="t foot" x="44" y="334">~1.7k tokens once</text>
  <text class="t foot-sub" x="180" y="334">then ~600 per later request</text>
  <text class="t foot-cap" x="956" y="334" text-anchor="end">no network · no writes</text>
</svg>
